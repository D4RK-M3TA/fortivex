    <meta name="author" content="Fortivex Studio">
    <meta name="robots" content="index, follow">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://fortivex.com">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://fortivex.com">
    <meta property="og:title" content="FortiVex | Build. Automate. Scale.">
    <meta property="og:description" content="We design, build, and automate systems that help teams ship faster and operate smarter.">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#ffffff">
